# ------------------------------------------------------------- Databases

[[item]]
id = "postgresql"
name = "PostgreSQL"
vendor = "PostgreSQL Global Development Group (Windows build: EDB)"
homepage = "https://www.postgresql.org/download/"
license = "PostgreSQL License"
category = "database"
channels = ["17", "16", "15"]
requires-admin = { windows = true, linux = true }
notes = "On Linux, install PostgreSQL from the distribution or apt/yum.postgresql.org repositories; automatic installation is Windows only. The superuser password comes from a password field of the installer."

[[item.package]]
