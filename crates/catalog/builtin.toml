arch = "x64"
file = "exe"
detection = { kind = "command", program = "psql", args = ["--version"] }
install = { kind = "exe", args = ["--mode", "unattended", "--unattendedmodeui", "none", "--superpassword", "{secret:postgres_password}"], success-codes = [0] }
integrity = { kind = "pin-at-build" }
