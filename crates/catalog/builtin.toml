channels = ["14"]
requires-admin = { windows = true, linux = false }
notes = "Microsoft publishes a single permalink that always serves the latest build. The Studio pins the downloaded file's hash at build time; if Microsoft replaces the file, the embedded fallback (recommended) is used."

