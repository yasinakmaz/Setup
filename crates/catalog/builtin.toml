# Built-in Smart Prerequisites catalog.
#
# Rules for entries:
# * Only vendor-operated or vendor-listed sources. Never a random third-party
#   mirror. If fewer than three independent routes exist the Studio reports
#   "Source redundancy degraded" and recommends an embedded fallback.
# * Every package declares how integrity is established. `unverifiable`
#   packages are never downloaded automatically.
# * URL templates were checked against the vendors' servers when the entry
#   was written; the Studio re-validates them when resolving a build.

# ---------------------------------------------------------------- .NET

[[item]]
id = "dotnet-desktop-runtime"
name = ".NET Desktop Runtime"
vendor = "Microsoft"
homepage = "https://dotnet.microsoft.com/download/dotnet"
license = "MIT"
category = "runtime"
description = "Runtime for WPF and Windows Forms applications."
channels = ["10.0", "9.0", "8.0"]
requires-admin = { windows = true, linux = false }

[[item.package]]
os = "windows"
arch = "x64"
file = "exe"
detection = { kind = "dotnet-shared-framework", framework = "Microsoft.WindowsDesktop.App" }
install = { kind = "exe", args = ["/install", "/quiet", "/norestart"], success-codes = [0], reboot-codes = [1641, 3010], already-installed-codes = [1638] }
integrity = { kind = "dotnet-release-metadata", metadata-url = "https://builds.dotnet.microsoft.com/dotnet/release-metadata/{channel}/releases.json", component = "windowsdesktop", file-name = "windowsdesktop-runtime-win-x64.exe" }
signature = { authenticode-publisher = "Microsoft Corporation" }
[[item.package.source]]
route = "official-direct"
url = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/{version}/windowsdesktop-runtime-{version}-win-x64.exe"
[[item.package.source]]
route = "official-cdn"
url = "https://dotnetcli.blob.core.windows.net/dotnet/WindowsDesktop/{version}/windowsdesktop-runtime-{version}-win-x64.exe"

