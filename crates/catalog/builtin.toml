arch = "x64"
file = "exe"
detection = { kind = "registry", key = 'SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL', value = "SQLEXPRESS" }
install = { kind = "exe", args = ["/Q", "/ACTION=Install", "/FEATURES=SQLEngine", "/INSTANCENAME=SQLEXPRESS", "/IACCEPTSQLSERVERLICENSETERMS"], success-codes = [0], reboot-codes = [3010] }
integrity = { kind = "unverifiable" }

