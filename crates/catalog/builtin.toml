[[item]]
id = "vc-redist"
name = "Microsoft Visual C++ Redistributable (2015–2022)"
vendor = "Microsoft"
homepage = "https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist"
license = "Microsoft Software License Terms"
