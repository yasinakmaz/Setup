[[item]]
id = "sql-server-express"
name = "SQL Server Express"
vendor = "Microsoft"
homepage = "https://www.microsoft.com/sql-server/sql-server-downloads"
license = "Microsoft SQL Server Express License"
category = "database"
channels = ["2022"]
requires-admin = { windows = true, linux = true }
notes = "Microsoft distributes SQL Server Express through an interactive bootstrapper without published checksums. Use Embedded (with the offline media you downloaded and verified) or Custom sources with a hash."

[[item.package]]
