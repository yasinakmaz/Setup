[package]
name = "inst-fetch"
description = "Resumable, verified downloads and a content-addressed cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ureq"]
# HTTPS transport (rustls + platform certificate verifier).
ureq = ["dep:ureq"]

[dependencies]
inst-brand.workspace = true
inst-fsx.workspace = true
inst-wire.workspace = true
blake3.workspace = true
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ureq = { workspace = true, optional = true, features = ["platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true
